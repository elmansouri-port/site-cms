<!DOCTYPE html>
<html lang="fr">

    <title>Page introuvable  Rainbow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f5f3ff', 100: '#ede9fe', 200: '#ddd6fe', 300: '#c4b5fd', 400: '#a78bfa', 500: '#5e2d91', 600: '#4a2373', 700: '#3c1c5e' },
                        navy: { 900: '#1e1b4b', 800: '#312e81', 700: '#3730a3' }
                    },
                    fontFamily: { sans: ['Google Sans', 'system-ui', 'sans-serif'] },
                    borderRadius: { btn: '10px' }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/mega-menu.css">
    <style>
        .lang-switcher { position: relative; }
        .lang-switcher button { display: flex; align-items: center; gap: 4px; font-size: 0.8125rem; color: #64748b; cursor: pointer; background: none; border: none; padding: 4px 8px; border-radius: 6px; transition: color .2s; }
        .lang-switcher button:hover { color: #0f172a; }
        .lang-switcher .lang-dropdown { display: none; position: absolute; top: 100%; right: 0; background: #fff; border: 1px solid #e9e5ff; border-radius: 10px; box-shadow: 0 8px 24px rgba(124,58,237,.08); min-width: 140px; z-index: 200; padding: 4px 0; margin-top: 4px; }
        .lang-switcher.open .lang-dropdown { display: block; }
        .lang-dropdown button { display: block; width: 100%; text-align: left; padding: 8px 14px; font-size: 0.8125rem; color: #374151; border: none; background: none; cursor: pointer; }
        .lang-dropdown button:hover { background: #f5f3ff; }
        .lang-dropdown button.active { color: #7c3aed; font-weight: 600; }
    </style>
</head>
<body class="font-sans text-gray-700 antialiased bg-white">

                <img src="/images/Rainbow-AL-logo-banner.webp" alt="Rainbow" class="h-12 w-auto">

            <div class="hidden lg:flex items-center justify-center flex-1 gap-8">

                    <a href="#" class="text-sm text-gray-500 hover:text-navy-900 transition-colors font-medium">
                        <span data-i18n="nav.product">Produits</span>
                        <svg class="chevron w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                    </a>

                </div>
                <a href="/tarifs" class="text-sm text-gray-500 hover:text-navy-900 transition-colors font-medium" style="font-size:1rem">Tarifs</a>
                <div class="nav-dropdown">
                    <a href="#" class="text-sm text-gray-500 hover:text-navy-900 transition-colors font-medium">Ressources
                        <svg class="chevron w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                    </a>

                </div>
            </div>
            <div class="hidden lg:flex items-center gap-4 shrink-0">
                <div class="lang-switcher" id="lang-switcher">
                    <button onclick="document.getElementById('lang-switcher').classList.toggle('open')">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 008.716-6.747M12 21a9.004 9.004 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 017.843 4.582M12 3a8.997 8.997 0 00-7.843 4.582m15.686 0A11.953 11.953 0 0112 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0121 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0112 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 013 12c0-1.605.42-3.113 1.157-4.418"/></svg>
                        <span id="lang-current">EN</span>
                        <svg class="lang-chevron" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                    </button>
                    <div class="lang-dropdown" id="lang-dropdown"></div>
                </div>
                <a href="https://web.openrainbow.net/rb/2.176.0/login" class="px-5 py-2.5 rounded-btn border-2 border-brand-500 text-purple-900 hover:bg-gray-50 text-sm font-semibold transition-all active:scale-95 inline-flex items-center justify-center" data-i18n="nav.signin">Se connecter</a>
                <a href="https://web.openrainbow.net/rb/2.177.4/trial" class="px-5 py-2.5 rounded-btn bg-brand-500 hover:bg-brand-600 text-white text-sm font-semibold whitespace-nowrap shadow-md hover:shadow-lg transition-all">Essai gratuit</a>
            </div>
            <button id="mobile-menu-btn" class="lg:hidden p-2" aria-label="Menu">
                <svg class="w-6 h-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
        </div>
        <div id="mobile-menu" class="lg:hidden hidden border-t border-gray-100 bg-white px-5 pt-2 pb-6 shadow-lg space-y-1">
            <a href="#" class="mob-section-hdr"><span data-i18n="nav.product">Produits</span></a>
            <div class="mobile-submenu space-y-1">
                <a href="/products/collaboration" class="block py-1">Rainbow Collaboration</a>
                <a href="/products/webinar" class="block py-1">Rainbow Webinar</a>
            </div>
            <a href="/tarifs" class="mob-section-hdr">Tarifs</a>
            <a href="#" class="mob-section-hdr">Ressources</a>
            <div class="mobile-submenu space-y-1">
                <a href="/blog" class="block py-1" data-i18n="nav.blog">Blog</a>
                <a href="/reviews" class="block py-1" data-i18n="nav.reviews">Avis</a>
                <a href="/support" class="block py-1" data-i18n="nav.support">Support</a>
                <a href="/tutorials" class="block py-1" data-i18n="nav.tutorials">Tutoriels</a>
            </div>
            <div class="h-px bg-gray-100 mx-1 my-2"></div>
            <div id="mobile-lang-switcher" class="flex flex-wrap gap-2 px-1 py-1"></div>
            <div class="flex flex-col gap-2.5 pt-3">
                <a href="https://web.openrainbow.net/rb/2.176.0/login" class="w-full text-center px-6 py-3 rounded-btn border-2 border-brand-500 text-purple-900 hover:bg-gray-50 text-base font-semibold transition-all active:scale-95">Se connecter</a>
                <a href="/tarifs" class="w-full text-center px-6 py-3 rounded-btn bg-brand-500 hover:bg-brand-600 text-white text-base font-semibold shadow-md hover:shadow-lg transition-all active:scale-95">Essai gratuit</a>
            </div>
        </div>
    </nav>

    <!-- ===== 404 CONTENT ===== -->
    <main class="min-h-screen flex flex-col items-center justify-center px-6 pt-16">
        <div class="flex flex-col items-center text-center max-w-lg w-full">

            <h1>Alcatel-Lucent</h1>
            <h1>404</h1>

            <p class="text-gray-400 text-base mb-8">
                La page que vous cherchez n'existe pas ou a été déplacée.
            </p>

            <a href="/"
               class="inline-flex items-center gap-2 px-8 py-3 rounded-btn bg-brand-500 hover:bg-brand-600 text-white font-semibold text-sm shadow-md hover:shadow-lg transition-all active:scale-95">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                Retour à l'accueil
            </a>

        </div>
    </main>

    <script src="/js/mega-menu.js"></script>
    <script src="/js/i18n.js"></script>
    <script>
        document.addEventListener('click', function (e) {
            var sw = document.getElementById('lang-switcher');
            if (sw && !sw.contains(e.target)) sw.classList.remove('open');
        });
    </script>
</body>
</html>
