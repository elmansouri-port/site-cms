# Single origin for the whole stack.
#
#   /            → the Astro marketing site
#   /admin/      → the CMS single-page app
#   /api/        → the content API
#   /media/      → uploaded assets, served by the API
#
# Putting the CMS on the same origin as the API keeps the refresh-token cookie
# first-party, which is why the browser never needs a CORS preflight for the
# normal path.

upstream web_upstream { server web:3000; keepalive 32; }
upstream api_upstream { server api:4000; keepalive 32; }
upstream cms_upstream { server cms:80;   keepalive 16; }

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  # The marketing pages ship large hero images and two videos.
  client_max_body_size 32m;
  sendfile on;
  tcp_nopush on;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  location /admin/ {
    proxy_pass http://cms_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # A named asset reference. The API resolves it to the current file; the
  # renderer normally does this server-side, so this is the fallback for a
  # reference that escaped the render pass.
  location /media/a/ {
    rewrite ^/media/a/(.*)$ /api/v1/site/asset/$1 break;
    proxy_pass http://api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /media/ {
    proxy_pass http://api_upstream;
    proxy_set_header Host $host;
    proxy_cache_valid 200 30d;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
  }
}
