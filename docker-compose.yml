name: rainbow-site-cms

# Five services: the database, the cache, the content API, the Astro frontend
# and the CMS. One gateway in front of them means a single origin in the
# browser, so the CMS and the site share cookies and there is no CORS to
# configure for the normal path.

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "1"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-rainbow}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-rainbow-dev-password}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-rainbow_cms}
    volumes:
      - mongo-data:/data/db
      - ./infra/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [rainbow]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [rainbow]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-rainbow}:${MONGO_ROOT_PASSWORD:-rainbow-dev-password}@mongo:27017/${MONGO_DB:-rainbow_cms}?authSource=admin
      REDIS_URL: redis://redis:6379
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:8080/admin}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:3000,http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PREVIEW_SECRET: ${PREVIEW_SECRET:?set PREVIEW_SECRET in .env}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?set REVALIDATE_SECRET in .env}
      REVALIDATE_URL: http://web:3000/cms/revalidate
      # Hosts an integration may point at even though they resolve inside the
      # network — the automation platform is on the company LAN.
      INTEGRATION_ALLOWED_HOSTS: ${INTEGRATION_ALLOWED_HOSTS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@rainbow.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      UPLOAD_DIR: /data/uploads
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [rainbow]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      API_URL: http://api:4000
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      PREVIEW_SECRET: ${PREVIEW_SECRET:?set PREVIEW_SECRET in .env}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?set REVALIDATE_SECRET in .env}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-fr}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks: [rainbow]

  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:80/admin/"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [rainbow]

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
      - cms
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [rainbow]

volumes:
  mongo-data:
  redis-data:
  uploads:

networks:
  rainbow:
    driver: bridge
